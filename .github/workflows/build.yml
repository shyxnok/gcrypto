name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号（产物命名，示例 v1.0.0）'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

# 定义编译目标平台，按需增减
env:
  BIN_NAME: gcrypto

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false       # 一个平台编译失败，不中断其余平台
      matrix:
        target:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Version
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            v="${{ github.ref_name }}"
          fi
          v="${v:-v0.0.0}"
          echo "value=${v}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${v}" >> "$GITHUB_ENV"

      - name: Cross compile binary
        shell: bash
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          OUTPUT: dist/${{ env.BIN_NAME }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}
        run: |
          go mod tidy
          mkdir -p dist
          go build -ldflags "-s -w" -o "${OUTPUT}"

      - name: Upload single platform artifact
        uses: actions/upload-artifact@v4
        with:
          # 每个平台独立名称：gcrypto-v1.0.0-linux-amd64
          name: ${{ env.BIN_NAME }}-${{ steps.ver.outputs.value }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/${{ env.BIN_NAME }}-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.ext }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ALL separate artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gcrypto ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}